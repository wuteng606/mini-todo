<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D 猫咪 · 原型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, "PingFang SC", sans-serif;
    background:
      radial-gradient(60% 50% at 20% 10%, #fff3ea 0%, transparent 60%),
      radial-gradient(55% 55% at 85% 15%, #eae6ff 0%, transparent 62%),
      radial-gradient(70% 60% at 50% 100%, #dff0f5 0%, transparent 65%),
      linear-gradient(160deg, #fdf8f4 0%, #f3f0fa 50%, #eaf4f7 100%);
    color: #2b2a33;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
  #cat { width: min(80vh, 760px); height: min(80vh, 760px); display: block; touch-action: none; cursor: pointer; }

  .top {
    position: absolute; top: 26px; left: 30px;
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; font-weight: 600; color: #6d6b7a; letter-spacing: .01em;
  }
  .top .dot { width: 7px; height: 7px; border-radius: 50%; background: #2f6bff; box-shadow: 0 0 0 4px rgba(47,107,255,.14); }
  .top .pill {
    padding: 4px 9px; border-radius: 99px; background: rgba(255,255,255,.7);
    border: 1px solid rgba(255,255,255,.9); font-size: 10.5px; color: #8f8b9d;
  }

  .bottom {
    position: absolute; bottom: 26px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .hint { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .hint span {
    font-size: 11.5px; color: #6d6b7a; background: rgba(255,255,255,.68);
    border: 1px solid rgba(255,255,255,.9); border-radius: 99px; padding: 5px 11px;
    box-shadow: 0 6px 16px -12px rgba(70,60,100,.5);
  }
  .hint span b { color: #2f6bff; font-weight: 700; }
  .state { font-size: 10.5px; color: #a9a6b5; letter-spacing: .06em; text-transform: uppercase; }
  .bubble {
    position: absolute; transform: translate(-50%, -100%);
    background: #fff; color: #4b4856; font-size: 13px; font-weight: 600;
    padding: 8px 13px; border-radius: 16px 16px 4px 16px;
    box-shadow: 0 12px 26px -12px rgba(70,60,100,.5);
    pointer-events: none; opacity: 0; transition: opacity .18s ease, transform .18s ease;
    white-space: nowrap;
  }
  .bubble.show { opacity: 1; transform: translate(-50%, -112%); }
</style>
</head>
<body>
<div class="stage">
  <canvas id="cat"></canvas>
  <div class="top">
    <span class="dot"></span>
    3D 猫咪 · 原型 v2
    <span class="pill">three.js</span>
  </div>
  <div class="bottom">
    <div class="hint">
      <span>移动鼠标，它会<b>睁眼</b>看你</span>
      <span><b>点一下</b> 会蹦一下</span>
      <span>按住<b>拖一拖</b> 会歪头</span>
    </div>
    <div class="state" id="state">idle</div>
  </div>
  <div class="bubble" id="bubble">喵～</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

/* ================================================================ *
 * 基础
 * ================================================================ */
const canvas = document.getElementById("cat");
const stateEl = document.getElementById("state");
const bubbleEl = document.getElementById("bubble");

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 1.34, 4.5);
camera.lookAt(0, 0.72, 0.12);

/* ================================================================ *
 * 灯光：柔光棚拍
 * ================================================================ */
scene.add(new THREE.HemisphereLight(0xfff7ee, 0xc4bed6, 1.0));

const key = new THREE.DirectionalLight(0xfff2df, 2.4);
key.position.set(2.2, 4.0, 3.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 12;
key.shadow.camera.left = -3;
key.shadow.camera.right = 3;
key.shadow.camera.top = 3;
key.shadow.camera.bottom = -1.5;
key.shadow.bias = -0.0005;
key.shadow.normalBias = 0.02;
key.shadow.radius = 6;
scene.add(key);

const rim = new THREE.DirectionalLight(0xa8c8ff, 2.0);
rim.position.set(-3.0, 2.0, -2.6);
scene.add(rim);

const fill = new THREE.DirectionalLight(0xffe0cf, 0.85);
fill.position.set(-0.6, 0.9, 4.2);
scene.add(fill);

/* ================================================================ *
 * 材质
 * ================================================================ */
const makeFurAlpha = () => {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  g.fillStyle = "#000";
  g.fillRect(0, 0, 256, 256);
  g.lineWidth = 1;
  for (let i = 0; i < 11000; i++) {
    const x = Math.random() * 256;
    const y = Math.random() * 256;
    const len = 2 + Math.random() * 8;
    g.globalAlpha = 0.35 + Math.random() * 0.65;
    g.strokeStyle = "#fff";
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + (Math.random() - 0.5) * 2.5, y - len);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.NoColorSpace;
  return t;
};
const furAlpha = makeFurAlpha();

const furMat = (color, opts = {}) =>
  new THREE.MeshPhysicalMaterial({
    color,
    roughness: 0.96,
    metalness: 0,
    sheen: 1,
    sheenRoughness: 0.42,
    sheenColor: new THREE.Color(0xffffff),
    clearcoat: 0.04,
    clearcoatRoughness: 0.95,
    ...opts,
  });

const M = {
  fur: furMat(0xe9e3dd),
  furSoft: furMat(0xded7d1),
  cream: furMat(0xfbf6f0),
  inner: furMat(0xefb6b8),
  nose: new THREE.MeshPhysicalMaterial({ color: 0xd98f90, roughness: 0.45, clearcoat: 0.4 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x8b7d78, roughness: 0.7 }),
  eye: new THREE.MeshPhysicalMaterial({ color: 0x3a3238, roughness: 0.16, clearcoat: 1 }),
  shine: new THREE.MeshBasicMaterial({ color: 0xffffff }),
  blush: new THREE.MeshBasicMaterial({ color: 0xef9a9a, transparent: true, opacity: 0.26, depthWrite: false }),
};

const sphere = (r, w = 40, h = 28) => new THREE.SphereGeometry(r, w, h);

/* ================================================================ *
 * 绒毛外壳：同一几何体叠 9 层，用噪声 alpha 裁出毛边
 * ================================================================ */
function addFur(mesh, parent, layers = 9, step = 0.009) {
  for (let i = 1; i <= layers; i++) {
    const mat = furMat(mesh.material.color.getHex()).clone();
    const alphaMap = furAlpha.clone();
    alphaMap.needsUpdate = true;
    alphaMap.repeat.set(3.4, 3.4);
    alphaMap.offset.set(Math.random(), Math.random());
    mat.alphaMap = alphaMap;
    mat.alphaTest = 0.42;
    mat.transparent = false;
    mat.depthWrite = true;
    mat.side = THREE.FrontSide;

    const shell = new THREE.Mesh(mesh.geometry, mat);
    shell.scale.copy(mesh.scale).multiplyScalar(1 + i * step);
    shell.position.copy(mesh.position);
    shell.rotation.copy(mesh.rotation);
    shell.castShadow = false;
    shell.receiveShadow = false;
    parent.add(shell);
  }
}

/* ================================================================ *
 * 建模：趴着的小猫
 * ================================================================ */
const cat = new THREE.Group();
scene.add(cat);

/* 身体（面包状） */
const body = new THREE.Mesh(sphere(0.86, 44, 30), M.fur);
body.scale.set(0.76, 0.56, 0.98);
body.position.set(0, 0.48, -0.5);
body.castShadow = true;
body.receiveShadow = true;
cat.add(body);
addFur(body, cat, 8, 0.0075);

/* 屁股/后腿 */
for (const side of [1, -1]) {
  const h = new THREE.Mesh(sphere(0.36, 32, 22), M.fur);
  h.scale.set(0.9, 0.72, 0.95);
  h.position.set(side * 0.36, 0.34, -0.92);
  h.castShadow = true;
  cat.add(h);
  addFur(h, cat, 5, 0.009);
}

/* 头 */
const headGroup = new THREE.Group();
headGroup.position.set(0, 0.94, 0.44);
cat.add(headGroup);

const head = new THREE.Mesh(sphere(0.6, 48, 34), M.fur);
head.scale.set(1.05, 0.98, 0.99);
head.castShadow = true;
head.receiveShadow = true;
headGroup.add(head);
/* 头部只做很短的绒毛，避免糊住五官 */
addFur(head, headGroup, 4, 0.0045);

/* 脸颊绒毛 */
for (const side of [1, -1]) {
  const cheek = new THREE.Mesh(sphere(0.22, 28, 20), M.fur);
  cheek.scale.set(1.05, 0.92, 0.82);
  cheek.position.set(side * 0.38, -0.13, 0.26);
  cheek.castShadow = true;
  headGroup.add(cheek);
  addFur(cheek, headGroup, 4, 0.012);
}

/* 耳朵 */
function makeEar(side) {
  const g = new THREE.Group();
  const outer = new THREE.Mesh(new THREE.ConeGeometry(0.29, 0.5, 36), M.fur);
  outer.scale.z = 0.46;
  outer.castShadow = true;
  g.add(outer);
  const inner = new THREE.Mesh(new THREE.ConeGeometry(0.185, 0.36, 28), M.inner);
  inner.scale.z = 0.32;
  inner.position.set(0, -0.04, 0.09);
  g.add(inner);
  g.position.set(side * 0.36, 0.5, 0.02);
  g.rotation.z = -side * 0.36;
  g.rotation.x = -0.02;
  return g;
}
const earL = makeEar(1);
const earR = makeEar(-1);
headGroup.add(earL, earR);

/* 口鼻 */
const muzzle = new THREE.Mesh(sphere(0.245, 32, 22), M.cream);
muzzle.scale.set(1.22, 0.86, 0.72);
muzzle.position.set(0, -0.12, 0.5);
muzzle.castShadow = true;
headGroup.add(muzzle);

const nose = new THREE.Mesh(new THREE.SphereGeometry(0.055, 24, 18), M.nose);
nose.scale.set(1.4, 0.9, 0.8);
nose.position.set(0, -0.02, 0.685);
headGroup.add(nose);

/* 嘴：两段小弧 */
for (const side of [1, -1]) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(0.052, 0.009, 8, 16, Math.PI), M.dark);
  m.position.set(side * 0.045, -0.135, 0.665);
  m.rotation.z = side > 0 ? Math.PI * 0.95 : Math.PI * 0.05;
  m.rotation.y = side * 0.16;
  headGroup.add(m);
}

/* 胡须 */
const whiskerMat = new THREE.MeshStandardMaterial({ color: 0xcfc7bf, roughness: 0.85 });
for (const side of [1, -1]) {
  for (let i = 0; i < 3; i++) {
    const len = 0.36 - i * 0.045;
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.0012, len, 5), whiskerMat);
    w.position.set(side * (0.24 + len / 2 - 0.05), -0.04 - i * 0.045, 0.5);
    w.rotation.z = side * (Math.PI / 2 + 0.16 - i * 0.14);
    w.rotation.y = side * 0.5;
    headGroup.add(w);
  }
}

/* 闭眼（默认）：两道向上弯的弧 */
const closedEyes = new THREE.Group();
for (const side of [1, -1]) {
  const e = new THREE.Mesh(new THREE.TorusGeometry(0.072, 0.012, 8, 20, Math.PI), M.dark);
  e.position.set(side * 0.225, 0.05, 0.575);
  e.rotation.z = Math.PI;
  e.rotation.y = side * 0.24;
  closedEyes.add(e);
}
headGroup.add(closedEyes);

/* 睁眼（悬停才出现） */
const openEyes = new THREE.Group();
const eyeMeshes = [];
for (const side of [1, -1]) {
  const g = new THREE.Group();
  const ball = new THREE.Mesh(sphere(0.092, 28, 22), M.eye);
  g.add(ball);
  const hl = new THREE.Mesh(sphere(0.03, 16), M.shine);
  hl.position.set(0.03, 0.034, 0.075);
  g.add(hl);
  g.position.set(side * 0.225, 0.05, 0.575);
  g.scale.setScalar(0.001);
  openEyes.add(g);
  eyeMeshes.push(g);
}
headGroup.add(openEyes);

/* 腮红 */
for (const side of [1, -1]) {
  const b = new THREE.Mesh(new THREE.CircleGeometry(0.1, 24), M.blush);
  b.position.set(side * 0.4, -0.13, 0.36);
  b.rotation.y = side * 0.72;
  b.scale.setScalar(0.001);
  headGroup.add(b);
  b.userData.blush = true;
}

/* 前爪：并排揣在胸前 */
const paws = [];
for (const side of [1, -1]) {
  const p = new THREE.Mesh(sphere(0.15, 28, 20), M.cream);
  p.scale.set(1, 0.68, 1.15);
  p.position.set(side * 0.15, 0.17, 0.46);
  p.castShadow = true;
  cat.add(p);
  addFur(p, cat, 4, 0.014);
  paws.push(p);
}

/* 尾巴：贴着身体右侧，只露一小段 */
const tailGroup = new THREE.Group();
cat.add(tailGroup);
const tailCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.4, 0.34, -0.85),
  new THREE.Vector3(0.62, 0.24, -0.66),
  new THREE.Vector3(0.7, 0.19, -0.42),
  new THREE.Vector3(0.66, 0.17, -0.22),
]);
const tail = new THREE.Mesh(new THREE.TubeGeometry(tailCurve, 40, 0.082, 16, false), M.fur);
tail.castShadow = true;
tailGroup.add(tail);
const tailTip = new THREE.Mesh(sphere(0.082, 24), M.fur);
tailTip.position.set(0.66, 0.17, -0.22);
tailGroup.add(tailTip);

/* 阴影承接 */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 12),
  new THREE.ShadowMaterial({ color: 0x4a3a5a, opacity: 0.15, transparent: true })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* 命中球 */
const hit = new THREE.Mesh(
  new THREE.SphereGeometry(1.15, 12, 10),
  new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
);
hit.position.set(0, 0.62, 0.1);
hit.scale.set(1.15, 0.85, 1.25);
scene.add(hit);

/* ================================================================ *
 * 爱心
 * ================================================================ */
function heartTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d");
  g.fillStyle = "#ff85a8";
  g.beginPath();
  g.moveTo(32, 57);
  g.bezierCurveTo(2, 34, 12, 7, 32, 19);
  g.bezierCurveTo(52, 7, 62, 34, 32, 57);
  g.fill();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const heartTex = heartTexture();
const hearts = [];
for (let i = 0; i < 14; i++) {
  const s = new THREE.Sprite(
    new THREE.SpriteMaterial({ map: heartTex, transparent: true, depthWrite: false, opacity: 0 })
  );
  s.visible = false;
  scene.add(s);
  hearts.push({ sprite: s, life: 0, vel: new THREE.Vector3(), size: 0.2 });
}
function burstHearts(origin) {
  let used = 0;
  for (const h of hearts) {
    if (used >= 10) break;
    if (h.life > 0) continue;
    used++;
    h.life = 1;
    h.sprite.visible = true;
    h.sprite.position.copy(origin);
    h.sprite.position.x += (Math.random() - 0.5) * 0.7;
    h.sprite.position.y += (Math.random() - 0.4) * 0.3;
    h.size = 0.12 + Math.random() * 0.1;
    h.vel.set((Math.random() - 0.5) * 0.9, 0.85 + Math.random() * 0.7, (Math.random() - 0.5) * 0.3);
  }
}

/* ================================================================ *
 * 交互
 * ================================================================ */
const S = {
  hovered: false,
  pressed: false,
  dragging: false,
  jumpT: -1,
  look: new THREE.Vector2(0, 0),
  target: new THREE.Vector2(0, 0),
  tilt: 0,
  tiltTarget: 0,
  nextBlink: 2.2,
  blinkT: -1,
  eyeOpen: 0,
  earPerk: 0,
  earPerkTarget: 0,
  blush: 0,
};

const clock = new THREE.Clock();
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const down = { x: 0, y: 0, t: 0 };
const setState = (n) => { if (stateEl.textContent !== n) stateEl.textContent = n; };

const phrases = ["喵～", "摸摸头", "再来一次！", "今天也要加油呀", "呼噜呼噜…"];
const bubble = document.getElementById("bubble");
let bubbleTimer = 0;
function say(text) {
  bubble.textContent = text;
  bubble.classList.add("show");
  bubbleTimer = 1.6;
}

canvas.addEventListener("pointermove", (e) => {
  const r = canvas.getBoundingClientRect();
  ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -(((e.clientY - r.top) / r.height) * 2 - 1);

  ray.setFromCamera(ndc, camera);
  S.hovered = ray.intersectObject(hit, false).length > 0 || S.pressed;
  S.earPerkTarget = S.hovered ? 1 : 0;

  S.target.set(ndc.x, ndc.y);
  if (S.dragging) S.tiltTarget = ndc.x * 0.3;
});

canvas.addEventListener("pointerdown", (e) => {
  S.pressed = true;
  down.x = e.clientX; down.y = e.clientY; down.t = performance.now();
  canvas.setPointerCapture(e.pointerId);
});

window.addEventListener("pointerup", (e) => {
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  const dt = performance.now() - down.t;
  const was = S.pressed;
  S.pressed = false;
  S.tiltTarget = 0;
  if (was && moved < 8 && dt < 400 && S.hovered) {
    S.jumpT = 0;
    burstHearts(new THREE.Vector3(0, 1.5, 0.6));
    say(phrases[Math.floor(Math.random() * phrases.length)]);
  }
});

canvas.addEventListener("pointerleave", () => {
  S.hovered = false;
  S.pressed = false;
  S.earPerkTarget = 0;
  S.tiltTarget = 0;
  S.target.set(0, 0);
});

const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);

/* ================================================================ *
 * 尺寸
 * ================================================================ */
function resize() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);
resize();

/* ================================================================ *
 * 主循环
 * ================================================================ */
let t = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  t += dt;

  /* 视线跟随 */
  S.look.lerp(S.target, 0.1);
  headGroup.rotation.y = S.look.x * 0.36;
  headGroup.rotation.x = -S.look.y * 0.18;
  headGroup.rotation.z = S.look.x * 0.05;

  /* 呼吸 */
  const breathe = 1 + Math.sin(t * 1.9) * 0.01;
  body.scale.set(0.98 * breathe, 0.62 * breathe, 1.12);
  cat.position.y = Math.sin(t * 1.9 + 0.5) * 0.008;

  /* 耳朵 */
  S.earPerk += (S.earPerkTarget - S.earPerk) * 0.08;
  const twitch = Math.sin(t * 22) * 0.02 * Math.max(0, Math.sin(t * 0.6));
  earL.rotation.z = -0.36 + S.earPerk * 0.1 + twitch;
  earR.rotation.z = 0.36 - S.earPerk * 0.1 - twitch;

  /* 尾巴 */
  const speed = S.hovered ? 2.8 : 1.4;
  tailGroup.rotation.y = Math.sin(t * speed) * (S.hovered ? 0.1 : 0.06);
  tailGroup.rotation.z = Math.sin(t * speed * 0.8) * 0.05;

  /* 歪头 */
  S.tilt += (S.tiltTarget - S.tilt) * 0.08;
  cat.rotation.z = -S.tilt * 0.3;
  cat.rotation.y = S.tilt * 0.25;

  /* 呼吸时胡须轻颤 */
  headGroup.position.y = 0.98 + Math.sin(t * 1.9) * 0.004;
  headGroup.rotation.z += Math.sin(t * 1.3) * 0.004;

  /* 睁眼：悬停时睁眼 */
  const eyeTarget = S.hovered || S.pressed ? 1 : 0;
  S.eyeOpen += (eyeTarget - S.eyeOpen) * 0.14;
  for (const g of eyeMeshes) g.scale.setScalar(Math.max(0.001, S.eyeOpen));
  closedEyes.children.forEach((e) => {
    e.visible = S.eyeOpen < 0.35;
    e.scale.setScalar(Math.max(0.001, 1 - S.eyeOpen));
  });

  /* 腮红随悬停变深 */
  S.blush += ((S.hovered ? 1 : 0.35) - S.blush) * 0.1;
  headGroup.children.forEach((c) => {
    if (c.userData.blush) {
      c.material.opacity = 0.16 + S.blush * 0.18;
      c.scale.setScalar(Math.min(1, 0.3 + S.blush * 0.8));
    }
  });

  /* 眨眼：只在睁眼时发生 */
  if (S.eyeOpen > 0.6) {
    S.nextBlink -= dt;
    if (S.blinkT < 0 && S.nextBlink <= 0) { S.blinkT = 0; S.nextBlink = 2.6 + Math.random() * 3.4; }
    if (S.blinkT >= 0) {
      S.blinkT += dt / 0.14;
      const p = Math.min(1, S.blinkT);
      const closed = p < 0.5 ? p * 2 : (1 - p) * 2;
      for (const g of eyeMeshes) g.scale.y = Math.max(0.001, (1 - closed * 0.9) * S.eyeOpen);
      if (p >= 1) { S.blinkT = -1; for (const g of eyeMeshes) g.scale.y = S.eyeOpen; }
    }
  } else {
    S.nextBlink = 1.6;
  }

  /* 按压 */
  if (S.pressed) {
    cat.scale.y = 0.965;
    cat.position.y -= 0.02;
  } else {
    cat.scale.y += (1 - cat.scale.y) * 0.2;
  }

  /* 蹦一下 */
  if (S.jumpT >= 0) {
    S.jumpT += dt / 0.7;
    const p = S.jumpT;
    if (p >= 1) {
      S.jumpT = -1;
      cat.position.y = 0;
      cat.scale.set(1, 1, 1);
    } else if (p < 0.2) {
      const k = p / 0.2;
      cat.scale.set(1 + 0.07 * k, 1 - 0.1 * k, 1 + 0.04 * k);
      cat.position.y = -0.03 * k;
    } else if (p < 0.7) {
      const k = (p - 0.2) / 0.5;
      cat.position.y = Math.sin(k * Math.PI) * 0.5;
      cat.scale.set(0.97, 1.06, 0.97);
    } else {
      const k = (p - 0.7) / 0.3;
      const e = 1 - easeOutCubic(k);
      cat.position.y = 0;
      cat.scale.set(1 + 0.1 * e, 1 - 0.12 * e, 1 + 0.06 * e);
    }
  }

  /* 爱心 */
  for (const h of hearts) {
    if (h.life <= 0) continue;
    h.life -= dt / 1.1;
    h.sprite.position.addScaledVector(h.vel, dt);
    h.vel.y -= dt * 0.55;
    const p = 1 - h.life;
    h.sprite.material.opacity = Math.max(0, Math.sin(Math.min(p, 1) * Math.PI) * 1.05);
    const s = h.size * (0.7 + p * 0.9);
    h.sprite.scale.set(s, s, 1);
    if (h.life <= 0) h.sprite.visible = false;
  }

  /* 气泡 */
  if (bubbleTimer > 0) {
    bubbleTimer -= dt;
    if (bubbleTimer <= 0) bubble.classList.remove("show");
  }

  if (S.jumpT >= 0) setState("jump");
  else if (S.pressed) setState("press");
  else if (S.hovered) setState("hover");
  else setState("idle");

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

tick();
</script>
</body>
</html>
