<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="200" y1="80" x2="840" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#96BEFF"/>
      <stop offset="0.38" stop-color="#548AFF"/>
      <stop offset="0.72" stop-color="#2F5CF0"/>
      <stop offset="1" stop-color="#1E3FC8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="512" y1="140" x2="512" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="warm" cx="0" cy="0" r="1" gradientTransform="translate(512 830) scale(320 150)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD9C7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFD9C7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <rect x="146" y="146" width="732" height="732" rx="200"/>
    </clipPath>
    <filter id="soft" x="80" y="60" width="880" height="920" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#12307F" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <!-- 猫耳 -->
    <path d="M276 240 L282 126 L400 190 Z" fill="url(#bg)" stroke="url(#bg)" stroke-width="54" stroke-linejoin="round"/>
    <path d="M748 240 L742 126 L624 190 Z" fill="url(#bg)" stroke="url(#bg)" stroke-width="54" stroke-linejoin="round"/>

    <!-- 主体 -->
    <rect x="146" y="146" width="732" height="732" rx="200" fill="url(#bg)"/>
    <rect x="146" y="146" width="732" height="732" rx="200" fill="url(#gloss)"/>
    <rect x="147.5" y="147.5" width="729" height="729" rx="198.5" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="3"/>

    <!-- 底部暖光（裁剪在圆角内） -->
    <g clip-path="url(#round)">
      <rect x="146" y="640" width="732" height="240" fill="url(#warm)"/>
    </g>

    <!-- 对勾 -->
    <path d="M330 528 L458 656 L688 404" stroke="#FFFFFF" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 小星 -->
    <path d="M726 262 L734 296 L768 304 L734 312 L726 346 L718 312 L684 304 L718 296 Z" fill="#FFE6A8" opacity="0.95"/>
  </g>
</svg>
