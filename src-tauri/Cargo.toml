[package]
name = "mini-todo"
version = "0.1.0"
description = "A tiny local-first todo app for macOS and Windows"
authors = ["Mini Todo"]
edition = "2021"
# 让 cargo 按本机 Rust 版本挑选依赖，避免拉到要求 1.90 的 crate
resolver = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"

# macOS 专用：直接操作 NSWindow，让快捷窗口能浮在全屏应用之上
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow"] }

[features]
default = []
# 打包时启用：把前端 dist 内嵌进二进制，脱离 dev server 运行
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
